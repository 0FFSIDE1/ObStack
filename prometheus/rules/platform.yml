groups:
  - name: obstack-platform
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Prometheus target is unavailable"
          description: "Target {{ $labels.job }} / {{ $labels.instance }} has been down for more than 5 minutes."
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus rejected its most recent configuration reload."
