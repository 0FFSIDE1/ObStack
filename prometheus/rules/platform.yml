groups:
  - name: obstack-platform
    rules:
      - alert: PrometheusTargetMissing
        expr: up{job!="application-metrics"} == 0
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Prometheus target is unavailable"
          description: "Target {{ $labels.job }} / {{ $labels.instance }} has been down for more than 5 minutes."

      - alert: ApplicationHealthProbeFailed
        expr: probe_success{job="blackbox"} == 0
        for: 3m
        labels:
          severity: warning
          category: application-availability
        annotations:
          summary: "Application liveness endpoint is unavailable"
          description: >-
            The {{ $labels.service }} liveness endpoint on {{ $labels.host }}
            has failed for 3 minutes. This endpoint reports liveness only, not
            dependency readiness.

      - alert: ApplicationMetricsTargetUnavailable
        expr: up{job="application-metrics"} == 0
        for: 3m
        labels:
          severity: warning
          category: telemetry
        annotations:
          summary: "Application metrics target is unavailable"
          description: >-
            Prometheus cannot scrape {{ $labels.service }} on {{ $labels.host }}.
            Check the WireGuard path, host firewall, endpoint allowlists and
            application listener.

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 2m
        labels:
          severity: critical
          category: configuration
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus rejected its most recent configuration reload. Inspect config validation and Prometheus logs."

      - alert: PrometheusTSDBStorageWarning
        expr: prometheus_tsdb_storage_blocks_bytes > 2400000000
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Prometheus TSDB block storage is approaching its configured cap"
          description: "TSDB block storage is above 2.4 GB against the configured 3 GB retention-size cap. Review ingestion, series cardinality and disk headroom; plan scale-up if needed."

      - alert: PrometheusTSDBStorageCritical
        expr: prometheus_tsdb_storage_blocks_bytes > 2700000000
        for: 5m
        labels:
          severity: critical
          category: capacity
        annotations:
          summary: "Prometheus TSDB block storage has very little cap headroom"
          description: "TSDB block storage is above 2.7 GB against the configured 3 GB retention-size cap. Investigate promptly; this alert does not guarantee filesystem free-space headroom."
