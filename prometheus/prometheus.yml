global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: obstack
    environment: central
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels: {service: prometheus, role: observability}
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/application-health.json"]
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: application-metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/application-metrics.json"]
        refresh_interval: 60s
