server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/central.crt;
    ssl_certificate_key /etc/nginx/tls/central.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Alloy Prometheus remote_write. The receiver is enabled explicitly in
    # Prometheus Compose args; this route is never exposed without Basic Auth.
    location = /api/v1/write {
        auth_basic "ObStack metrics ingestion";
        auth_basic_user_file /etc/nginx/auth/metrics.htpasswd;

        proxy_pass http://prometheus:9090/api/v1/write;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Loki is configured with auth_enabled=true. Nginx authenticates each
    # enrolled agent and assigns the single-node ObStack tenant explicitly.
    location = /loki/api/v1/push {
        auth_basic "ObStack log ingestion";
        auth_basic_user_file /etc/nginx/auth/logs.htpasswd;

        proxy_pass http://loki:3100/loki/api/v1/push;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Scope-OrgID obstack;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
