name: Ansible validation

on:
  push:
    branches: ["**"]
    paths:
      - "ansible/**"
      - "ansible.cfg"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/ansible-validation.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/ansible-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, lint and Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.6 ansible-lint==25.9.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate all Ansible playbook syntax
        run: |
          set -euo pipefail
          for playbook in ansible/playbooks/*.yml; do
            echo "Checking ${playbook}"
            ansible-playbook -i ansible/inventory/hosts.example.yml "${playbook}" --syntax-check
          done

      - name: Run Ansible Lint
        run: ansible-lint --profile basic ansible/

      - name: Validate Compose manifest
        run: GRAFANA_ADMIN_USER=ci GRAFANA_ADMIN_PASSWORD=ci-validation-placeholder-password NGINX_BIND_ADDRESS=127.0.0.1 docker compose -f compose.yaml config --quiet
