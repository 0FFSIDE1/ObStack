name: Ansible validation

on:
  push:
    branches: ["**"]
    paths:
      - "ansible/**"
      - "ansible.cfg"
      - ".ansible-lint"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/ansible-validation.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/ansible-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, lint, Compose and Nginx validation
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.6 ansible-lint==25.9.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate all Ansible playbook syntax
        run: |
          set -euo pipefail
          for playbook in ansible/playbooks/*.yml; do
            echo "Checking ${playbook}"
            ansible-playbook -i ansible/inventory/hosts.example.yml "${playbook}" --syntax-check
          done

      - name: Run Ansible Lint
        run: ansible-lint --profile basic ansible/

      - name: Validate Compose manifest
        run: GRAFANA_ADMIN_USER=ci GRAFANA_ADMIN_PASSWORD=ci-validation-placeholder-password NGINX_BIND_ADDRESS=127.0.0.1 NGINX_AUTH_GID=20000 docker compose -f compose.yaml config --quiet

      - name: Validate Nginx configuration
        run: |
          set -euo pipefail
          mkdir -p /tmp/obstack-nginx/tls /tmp/obstack-nginx/auth
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/obstack-nginx/tls/central.key \
            -out /tmp/obstack-nginx/tls/central.crt \
            -subj "/CN=obstack-ci"
          touch /tmp/obstack-nginx/auth/metrics.htpasswd
          touch /tmp/obstack-nginx/auth/logs.htpasswd
          chgrp 20000 /tmp/obstack-nginx/tls/central.key /tmp/obstack-nginx/auth/metrics.htpasswd /tmp/obstack-nginx/auth/logs.htpasswd
          chmod 0640 /tmp/obstack-nginx/tls/central.key /tmp/obstack-nginx/auth/metrics.htpasswd /tmp/obstack-nginx/auth/logs.htpasswd
          docker run --rm --entrypoint nginx \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v /tmp/obstack-nginx/tls/central.crt:/etc/nginx/tls/central.crt:ro \
            -v /tmp/obstack-nginx/tls/central.key:/etc/nginx/tls/central.key:ro \
            -v /tmp/obstack-nginx/auth:/etc/nginx/auth:ro \
            nginx:1.28.0 -t
