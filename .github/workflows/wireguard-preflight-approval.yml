name: WireGuard CIDR preflight and human approval

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the ObStack VPC
        required: true
        type: string
      approved_vpc_cidr:
        description: VPC CIDR confirmed by the network owner
        required: true
        type: string
      home_office_vpn_cidrs:
        description: Comma-separated home/office VPN CIDRs (leave blank only if none)
        required: false
        type: string
        default: ""
      candidate_overlay_cidrs:
        description: Comma-separated candidate CIDRs to test
        required: true
        type: string
        default: "10.77.0.0/24,10.240.0.0/24,172.30.240.0/24,192.168.240.0/24"

permissions:
  contents: read

concurrency:
  group: obstack-wireguard-preflight
  cancel-in-progress: false

jobs:
  config-validation:
    name: Configuration validation
    uses: ./.github/workflows/validate.yml

  ansible-validation:
    name: Ansible syntax and lint validation
    uses: ./.github/workflows/ansible-validation.yml

  cidr-preflight:
    name: Read-only AWS and fleet CIDR discovery
    needs:
      - config-validation
      - ansible-validation
    if: ${{ needs.config-validation.result == 'success' && needs.ansible-validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_HOST_KEY_CHECKING: "True"
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.OBSTACK_DISCOVERY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.OBSTACK_DISCOVERY_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.OBSTACK_DISCOVERY_AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Install Ansible and AWS CLI
        run: |
          python -m pip install --disable-pip-version-check ansible-core==2.18.6 awscli
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install private inventory and pinned SSH trust
        shell: bash
        env:
          INVENTORY: ${{ secrets.OBSTACK_DISCOVERY_INVENTORY }}
          SSH_PRIVATE_KEY: ${{ secrets.OBSTACK_DISCOVERY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OBSTACK_DISCOVERY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$INVENTORY" || { echo "::error::Missing OBSTACK_DISCOVERY_INVENTORY secret"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing OBSTACK_DISCOVERY_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::Missing OBSTACK_DISCOVERY_KNOWN_HOSTS secret (verified SSH host keys)"; exit 1; }
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/obstack_discovery"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/obstack_discovery" "$HOME/.ssh/known_hosts"
          printf '%s\n' "$INVENTORY" > "$RUNNER_TEMP/obstack-inventory.yml"
          chmod 0600 "$RUNNER_TEMP/obstack-inventory.yml"
          echo "ANSIBLE_PRIVATE_KEY_FILE=$HOME/.ssh/obstack_discovery" >> "$GITHUB_ENV"
          echo "ANSIBLE_SSH_COMMON_ARGS=-o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Verify AWS identity and read-only discovery permissions
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-vpcs --region "$AWS_DEFAULT_REGION" --max-results 5 >/dev/null
          aws ec2 describe-subnets --region "$AWS_DEFAULT_REGION" --max-results 5 >/dev/null

      - name: Build validated discovery variables
        env:
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          VPC_CIDR_INPUT: ${{ inputs.approved_vpc_cidr }}
          VPN_CIDRS_INPUT: ${{ inputs.home_office_vpn_cidrs }}
          CANDIDATES_INPUT: ${{ inputs.candidate_overlay_cidrs }}
        run: |
          python - <<'PY'
          import json
          import os
          from ipaddress import ip_network
          from pathlib import Path

          def cidrs(value, required=False):
              items = [part.strip() for part in value.split(",") if part.strip()]
              if required and not items:
                  raise SystemExit("At least one candidate CIDR is required")
              for item in items:
                  ip_network(item, strict=True)
              return items

          vpc = str(ip_network(os.environ["VPC_CIDR_INPUT"], strict=True))
          data = {
              "obstack_aws_region": os.environ["AWS_REGION_INPUT"],
              "obstack_approved_vpc_cidr": vpc,
              "obstack_home_office_vpn_cidrs": cidrs(os.environ["VPN_CIDRS_INPUT"]),
              "obstack_candidate_overlay_cidrs": cidrs(os.environ["CANDIDATES_INPUT"], required=True),
          }
          Path(os.environ["RUNNER_TEMP"], "cidr-discovery-vars.json").write_text(json.dumps(data))
          PY

      - name: Run read-only CIDR discovery and fail closed on conflicts
        run: |
          set -euo pipefail
          ansible-playbook -i "$RUNNER_TEMP/obstack-inventory.yml" \
            ansible/playbooks/cidr-overlap-discovery.yml \
            -e "@$RUNNER_TEMP/cidr-discovery-vars.json" \
            --private-key "$HOME/.ssh/obstack_discovery"

      - name: Publish clean preflight result
        if: success()
        run: |
          {
            echo "## WireGuard CIDR preflight: passed"
            echo
            echo "- Configuration validation: passed"
            echo "- Ansible syntax and lint: passed"
            echo "- AWS VPC/subnet and fleet interface/route/Docker discovery: passed"
            echo "- Candidate overlap checker: passed"
            echo
            echo "**This is not network-owner approval and does not deploy or configure WireGuard.**"
            echo "The next job is a separate human approval checkpoint."
          } >> "$GITHUB_STEP_SUMMARY"

  wireguard-human-approval:
    name: Await designated network-owner approval (no deployment)
    needs: cidr-preflight
    if: ${{ needs.cidr-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: wireguard-approval
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Record approval checkpoint only
        run: |
          {
            echo "## Human approval checkpoint completed"
            echo
            echo "A reviewer approved the `wireguard-approval` GitHub Environment after successful CIDR preflight."
            echo
            "**No WireGuard keys, interfaces, routes, firewall rules, AWS resources, or production services were changed.**"
            echo "This approval does not authorize or trigger any deployment. A separate change and explicit deployment authorization are required."
          } >> "$GITHUB_STEP_SUMMARY"
