name: Validate configuration
on:
  workflow_call:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Run release changelog unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate application registrations and generated targets
        run: python scripts/validate_applications.py --check-generated
      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD
      - name: Scan repository for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v /tmp:/reports \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --redact --report-format json \
            --report-path=/reports/obstack-gitleaks.json --exit-code 1
      - name: Install Docker Compose plugin
        run: |
          docker compose version
      - name: Validate Compose model
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.7.3 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --platform linux/amd64 \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.7.3 \
            check rules /etc/prometheus/rules/platform.yml
          docker run --rm --platform linux/amd64 \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.7.3 \
            check rules /etc/prometheus/rules/generated-applications.yml
      - name: Validate Alertmanager configuration
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Blackbox Exporter configuration
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro" \
            prom/blackbox-exporter:v0.27.0 \
            --config.file=/etc/blackbox_exporter/config.yml --config.check
      - name: Validate Grafana provisioning and dashboard files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path("grafana/provisioning")
          for path in sorted(root.rglob("*.yaml")) + sorted(root.rglob("*.yml")):
              yaml.safe_load(path.read_text())
              print(f"Valid YAML: {path}")
          for path in sorted(root.rglob("*.json")):
              json.loads(path.read_text())
              print(f"Valid JSON: {path}")
          PY
      - name: Validate Loki configuration
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/loki:/etc/loki:ro" \
            grafana/loki:3.5.7 \
            -config.file=/etc/loki/config.yml -verify-config
