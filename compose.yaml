name: obstack
services:
  nginx:
    image: nginx:1.28.0
    platform: linux/arm64
    restart: unless-stopped
    user: "101:${NGINX_AUTH_GID:-20000}"
    ports: ["${NGINX_BIND_ADDRESS:-127.0.0.1}:443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/obstack/pki/central.crt:/etc/nginx/tls/central.crt:ro
      - /etc/obstack/pki/central.key:/etc/nginx/tls/central.key:ro
      - /etc/obstack/secrets/metrics.htpasswd:/etc/nginx/auth/metrics.htpasswd:ro
      - /etc/obstack/secrets/logs.htpasswd:/etc/nginx/auth/logs.htpasswd:ro
    networks: [backend]
    depends_on: [grafana, prometheus, loki]
    mem_limit: 64m
    cpus: 0.10
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  prometheus:
    image: prom/prometheus:v3.7.3
    platform: linux/arm64
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=3GB
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    networks: [backend]
    mem_limit: 384m
    cpus: 0.55
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  loki:
    image: grafana/loki:3.5.7
    platform: linux/arm64
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [backend]
    mem_limit: 384m
    cpus: 0.45
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  grafana:
    image: grafana/grafana:12.2.1
    platform: linux/arm64
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [backend]
    depends_on: [prometheus, loki]
    mem_limit: 256m
    cpus: 0.30
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  alertmanager:
    image: prom/alertmanager:v0.28.1
    platform: linux/arm64
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    group_add: ["${NGINX_AUTH_GID:-20000}"]
    networks: [backend]
    mem_limit: 96m
    cpus: 0.15
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    platform: linux/arm64
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    ports: ["127.0.0.1:9115:9115"]
    volumes: ["./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro"]
    networks: [backend]
    mem_limit: 48m
    cpus: 0.10
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

networks:
  backend:
    driver: bridge
volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:
