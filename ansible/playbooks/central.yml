---
- name: Provision and deploy the ObStack central host
  hosts: observability
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require explicit authorization for central-host changes
      ansible.builtin.assert:
        that:
          - obstack_apply | default(false) | bool
        fail_msg: "This playbook changes the central host. Review the plan, then pass -e obstack_apply=true during an approved change window."
    - name: Require the intended Ubuntu release and ARM64 architecture
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
          - ansible_architecture == "aarch64"
        fail_msg: "The central host must be Ubuntu 24.04 LTS on ARM64."
    - name: Require the checked-out repository path on the Ansible controller
      ansible.builtin.assert:
        that:
          - obstack_repo_root | default('') | length > 0
        fail_msg: "Set obstack_repo_root to the absolute path of the checked-out ObStack repository on the Ansible controller."
    - name: Require approved network addresses for certificate and firewall rules
      ansible.builtin.assert:
        that:
          - obstack_wg_vpn_ip | default('') | length > 0
          - obstack_wg_vpn_ip is ansible.utils.ipv4
          - obstack_ssh_allowed_cidr | default('') | length > 0
          - obstack_ssh_allowed_cidr is ansible.utils.ipv4
        fail_msg: "Set obstack_wg_vpn_ip to the approved central WireGuard IPv4 address and obstack_ssh_allowed_cidr to the verified administrator IPv4 CIDR."
    - name: Require Grafana administrator credentials from controller environment
      ansible.builtin.assert:
        that:
          - obstack_grafana_admin_user | default('') | length > 0
          - obstack_grafana_admin_password | default('') | length >= 24
        fail_msg: "Export OBSTACK_GRAFANA_ADMIN_USER and a 24+ character OBSTACK_GRAFANA_ADMIN_PASSWORD in the Ansible controller environment."
      no_log: true
    - name: Require verified static public egress IPv4 addresses for enrolled WireGuard spokes
      ansible.builtin.assert:
        that:
          - hostvars[item].obstack_wg_peer_public_ip | default('') is ansible.utils.ipv4
        fail_msg: "Set each enrolled host's obstack_wg_peer_public_ip to its verified static public egress IPv4 address."
      loop: "{{ groups['monitored'] | default([]) }}"
    - name: Require environment-backed per-host telemetry credentials
      ansible.builtin.assert:
        that:
          - hostvars[item].obstack_alloy_metrics_password | default('') | length >= 24
          - hostvars[item].obstack_alloy_logs_password | default('') | length >= 24
        fail_msg: "Export unique 24+ character OBSTACK_ALLOY_METRICS_PASSWORD_<HOST> and OBSTACK_ALLOY_LOGS_PASSWORD_<HOST> values for every enrolled host."
      loop: "{{ groups['monitored'] | default([]) }}"
      no_log: true
  roles:
    - central_base
    - docker
    - certificates
    - central_stack
  post_tasks:
    - name: Verify Compose service health and startup state
      ansible.builtin.command: docker compose ps --all
      args:
        chdir: "{{ obstack_install_dir }}"
      register: obstack_compose_status
      changed_when: false
    - name: Display service status
      ansible.builtin.debug:
        var: obstack_compose_status.stdout_lines
