---
# Read-only: never installs, stops, restarts, or reconfigures containers.
- name: Discover existing Alloy and Docker runtime
  hosts: monitored
  become: true
  gather_facts: true
  tasks:
    - name: Check Docker executable
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_cli
    - name: List all containers without environment values
      ansible.builtin.command:
        argv: [docker, ps, --all, --no-trunc, --format, "{{'{{'}}.ID{{'}}'}}|{{'{{'}}.Names{{'}}'}}|{{'{{'}}.Image{{'}}'}}|{{'{{'}}.Status{{'}}'}}"]
      register: docker_ps
      changed_when: false
      when: docker_cli.stat.exists
    - name: Identify Alloy candidates
      ansible.builtin.set_fact:
        obstack_alloy_ids: "{{ (docker_ps.stdout_lines | default([])) | select('search', '(?i)(grafana/alloy|alloy)') | map('split', '|') | map('first') | list }}"
    - name: Inspect safe Alloy metadata only
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            name={{'{{'}}.Name{{'}}'}} image={{'{{'}}.Config.Image{{'}}'}} state={{'{{'}}.State.Status{{'}}'}} restart={{'{{'}}.HostConfig.RestartPolicy.Name{{'}}'}} mounts={{'{{'}}range .Mounts{{'}}'}}{{'{{'}}.Source{{'}}'}}:{{'{{'}}.Destination{{'}}'}}:{{'{{'}}.RW{{'}}'}};{{'{{'}}end{{'}}'}} compose_project={{'{{'}}index .Config.Labels "com.docker.compose.project"{{'}}'}} compose_service={{'{{'}}index .Config.Labels "com.docker.compose.service"{{'}}'}}
          - "{{ item }}"
      loop: "{{ obstack_alloy_ids | default([]) }}"
      register: alloy_inspect
      changed_when: false
      when: docker_cli.stat.exists
    - name: Report discovered Alloy metadata
      ansible.builtin.debug:
        var: alloy_inspect.results
      when: docker_cli.stat.exists
