---
# Read-only: never installs, stops, restarts, or reconfigures containers.
# Targets every host currently in the monitored inventory group, regardless of fleet size.
- name: Discover existing Alloy and Docker runtime
  hosts: monitored
  become: true
  gather_facts: true
  tasks:
    - name: Locate Docker CLI
      ansible.builtin.command: docker --version
      register: docker_cli
      changed_when: false
      failed_when: false

    - name: Record Docker availability
      ansible.builtin.set_fact:
        obstack_docker_available: "{{ docker_cli.rc == 0 }}"

    - name: List all containers without environment values
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --all
          - --no-trunc
          - --format
          - "{{ '{{' }}.ID{{ '}}' }}|{{ '{{' }}.Names{{ '}}' }}|{{ '{{' }}.Image{{ '}}' }}|{{ '{{' }}.Status{{ '}}' }}"
      register: docker_ps
      changed_when: false
      when: obstack_docker_available

    - name: Identify Alloy candidates by image or container name
      ansible.builtin.set_fact:
        obstack_alloy_ids: "{{ (docker_ps.stdout_lines | default([])) | select('search', '(?i)(grafana/alloy|alloy)') | map('split', '|') | map('first') | list }}"

    - name: Inspect safe Alloy metadata only
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            name={{ '{{' }}.Name{{ '}}' }} image={{ '{{' }}.Config.Image{{ '}}' }} state={{ '{{' }}.State.Status{{ '}}' }} restart={{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }} mounts={{ '{{' }}range .Mounts{{ '}}' }}{{ '{{' }}.Source{{ '}}' }}:{{ '{{' }}.Destination{{ '}}' }}:{{ '{{' }}.RW{{ '}}' }};{{ '{{' }}end{{ '}}' }} compose_project={{ '{{' }}index .Config.Labels "com.docker.compose.project"{{ '}}' }} compose_service={{ '{{' }}index .Config.Labels "com.docker.compose.service"{{ '}}' }}
          - "{{ item }}"
      loop: "{{ obstack_alloy_ids | default([]) }}"
      register: alloy_inspect
      changed_when: false
      when: obstack_docker_available

    - name: Report host-level discovery summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          architecture: "{{ ansible_architecture }}"
          docker_available: "{{ obstack_docker_available }}"
          alloy_candidate_count: "{{ obstack_alloy_ids | default([]) | length }}"
          alloy_containers: "{{ alloy_inspect.results | default([]) | map(attribute='stdout') | list }}"

    - name: Report that Docker is absent
      ansible.builtin.debug:
        msg: "Docker CLI not found; no container discovery performed. No changes made."
      when: not obstack_docker_available
