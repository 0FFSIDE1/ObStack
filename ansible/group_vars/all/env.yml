---
# Secrets are read from the Ansible controller process environment only.
obstack_grafana_admin_user: "{{ lookup('ansible.builtin.env', 'OBSTACK_GRAFANA_ADMIN_USER') }}"
obstack_grafana_admin_password: "{{ lookup('ansible.builtin.env', 'OBSTACK_GRAFANA_ADMIN_PASSWORD') }}"
obstack_wg_private_key: "{{ lookup('ansible.builtin.env', 'OBSTACK_WG_PRIVATE_KEY_' ~ (inventory_hostname | upper | regex_replace('[^A-Z0-9]', '_'))) }}"
obstack_alloy_metrics_password: "{{ lookup('ansible.builtin.env', 'OBSTACK_ALLOY_METRICS_PASSWORD_' ~ (inventory_hostname | upper | regex_replace('[^A-Z0-9]', '_'))) }}"
obstack_alloy_logs_password: "{{ lookup('ansible.builtin.env', 'OBSTACK_ALLOY_LOGS_PASSWORD_' ~ (inventory_hostname | upper | regex_replace('[^A-Z0-9]', '_'))) }}"
