---
- name: Validate existing Alloy policy
  ansible.builtin.assert:
    that: [obstack_alloy_existing_policy in ['preserve', 'adopt']]
    fail_msg: "Allowed policies: preserve or adopt. Replacement is not automated."
- name: Preserve existing Alloy deployment by default
  ansible.builtin.debug:
    msg: "Preserving existing Alloy container. Discover its Compose owner, mounts and config before adoption."
  when: obstack_alloy_existing_policy == 'preserve'
- name: Require authenticated TLS endpoints and credentials for adoption
  ansible.builtin.assert:
    that:
      - obstack_alloy_remote_write_url is match('^https://')
      - obstack_alloy_loki_url is match('^https://')
      - obstack_alloy_username | length > 0
      - obstack_alloy_password | length > 0
      - obstack_alloy_ca_file | length > 0
    fail_msg: "Use HTTPS, a trusted CA and per-host credentials from Ansible Vault."
  when: obstack_alloy_existing_policy == 'adopt'
- name: Create Alloy config directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: obstack_alloy_existing_policy == 'adopt'
- name: Stage managed Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ obstack_alloy_config_path }}"
    owner: root
    group: root
    mode: "0640"
  when: obstack_alloy_existing_policy == 'adopt'
  notify: Report staged configuration
# No docker stop/rm/recreate/restart action is included.
