---
- name: Validate existing Alloy policy
  ansible.builtin.assert:
    that: [obstack_alloy_existing_policy in ['preserve', 'adopt']]
    fail_msg: "Allowed policies: preserve or adopt. Replacement is not automated."
- name: Preserve existing Alloy deployment by default
  ansible.builtin.debug:
    msg: "Preserving existing Alloy container. Discover its Compose owner, mounts and config before adoption."
  when: obstack_alloy_existing_policy == 'preserve'
- name: Require authenticated TLS endpoints and secrets for adoption
  ansible.builtin.assert:
    that:
      - obstack_alloy_remote_write_url is match('^https://')
      - obstack_alloy_loki_url is match('^https://')
      - obstack_alloy_metrics_username | length > 0
      - obstack_alloy_logs_username | length > 0
      - obstack_alloy_metrics_password | length > 0
      - obstack_alloy_logs_password | length > 0
      - obstack_alloy_ca_file | length > 0
    fail_msg: "Use HTTPS, a trusted CA and separate per-host credentials from Ansible Vault."
  when: obstack_alloy_existing_policy == 'adopt'
- name: Create Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/alloy
    - "{{ obstack_alloy_secrets_dir }}"
  when: obstack_alloy_existing_policy == 'adopt'
- name: Install metrics password file
  ansible.builtin.copy:
    content: "{{ obstack_alloy_metrics_password }}"
    dest: "{{ obstack_alloy_secrets_dir }}/metrics_password"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: obstack_alloy_existing_policy == 'adopt'
- name: Install logs password file
  ansible.builtin.copy:
    content: "{{ obstack_alloy_logs_password }}"
    dest: "{{ obstack_alloy_secrets_dir }}/logs_password"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: obstack_alloy_existing_policy == 'adopt'
- name: Stage managed Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ obstack_alloy_config_path }}"
    owner: root
    group: root
    mode: "0640"
  when: obstack_alloy_existing_policy == 'adopt'
  notify: Report staged configuration
# No Docker stop/rm/recreate/restart action is included.
