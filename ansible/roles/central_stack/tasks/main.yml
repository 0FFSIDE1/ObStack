---
- name: Install passlib for bcrypt htpasswd management
  ansible.builtin.apt:
    name: python3-passlib
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create protected telemetry authentication directory
  ansible.builtin.file:
    path: /etc/obstack/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create metrics htpasswd file
  ansible.builtin.file:
    path: /etc/obstack/secrets/metrics.htpasswd
    state: touch
    owner: root
    group: obstack-nginx
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Create logs htpasswd file
  ansible.builtin.file:
    path: /etc/obstack/secrets/logs.htpasswd
    state: touch
    owner: root
    group: obstack-nginx
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Require unique per-host metrics and logs credentials
  ansible.builtin.assert:
    that:
      - hostvars[item].obstack_alloy_metrics_password | default('') | length >= 24
      - hostvars[item].obstack_alloy_logs_password | default('') | length >= 24
      - (hostvars[item].obstack_alloy_metrics_username | default('obstack-' ~ item ~ '-metrics')) | length > 0
      - (hostvars[item].obstack_alloy_logs_username | default('obstack-' ~ item ~ '-logs')) | length > 0
    fail_msg: "Each enrolled monitored host needs unique usernames and 24+ character metrics/logs passwords stored in Ansible Vault."
  loop: "{{ groups['monitored'] | default([]) }}"
  no_log: true

- name: Add per-host metrics credentials to Nginx htpasswd
  community.general.htpasswd:
    path: /etc/obstack/secrets/metrics.htpasswd
    name: "{{ hostvars[item].obstack_alloy_metrics_username | default('obstack-' ~ item ~ '-metrics') }}"
    password: "{{ hostvars[item].obstack_alloy_metrics_password }}"
    crypt_scheme: bcrypt
    state: present
    owner: root
    group: obstack-nginx
    mode: "0640"
  loop: "{{ groups['monitored'] | default([]) }}"
  no_log: true

- name: Add per-host logs credentials to Nginx htpasswd
  community.general.htpasswd:
    path: /etc/obstack/secrets/logs.htpasswd
    name: "{{ hostvars[item].obstack_alloy_logs_username | default('obstack-' ~ item ~ '-logs') }}"
    password: "{{ hostvars[item].obstack_alloy_logs_password }}"
    crypt_scheme: bcrypt
    state: present
    owner: root
    group: obstack-nginx
    mode: "0640"
  loop: "{{ groups['monitored'] | default([]) }}"
  no_log: true

- name: Create deployment subdirectories
  ansible.builtin.file:
    path: "{{ obstack_install_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - prometheus
    - prometheus/rules
    - loki
    - grafana
    - grafana/provisioning
    - alertmanager
    - blackbox
    - nginx

- name: Copy central Compose manifest from the checked-out repository
  ansible.builtin.copy:
    src: "{{ obstack_repo_root }}/compose.yaml"
    dest: "{{ obstack_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Copy service configuration directories
  ansible.builtin.copy:
    src: "{{ obstack_repo_root }}/{{ item }}/"
    dest: "{{ obstack_install_dir }}/{{ item }}/"
    owner: root
    group: root
    mode: "0640"
    directory_mode: "0750"
  loop:
    - prometheus
    - loki
    - grafana
    - alertmanager
    - blackbox

- name: Copy Nginx configuration readable by its dedicated unprivileged group
  ansible.builtin.copy:
    src: "{{ obstack_repo_root }}/nginx/"
    dest: "{{ obstack_install_dir }}/nginx/"
    owner: root
    group: obstack-nginx
    mode: "0640"
    directory_mode: "0750"

- name: Install Grafana environment file
  ansible.builtin.copy:
    dest: "{{ obstack_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      GRAFANA_ADMIN_USER={{ obstack_grafana_admin_user }}
      GRAFANA_ADMIN_PASSWORD={{ obstack_grafana_admin_password }}
      NGINX_BIND_ADDRESS={{ obstack_nginx_bind_address | default('127.0.0.1') }}
      NGINX_AUTH_GID={{ obstack_nginx_auth_gid }}
  no_log: true

- name: Validate rendered Compose configuration
  ansible.builtin.command: docker compose config --quiet
  args:
    chdir: "{{ obstack_install_dir }}"
  changed_when: false

- name: Pull pinned service images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ obstack_install_dir }}"
  register: obstack_pull
  changed_when: "'Downloaded newer image' in obstack_pull.stdout or 'Pull complete' in obstack_pull.stdout"

- name: Deploy and start ObStack services
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ obstack_install_dir }}"
  register: obstack_up
  changed_when: "'Started' in obstack_up.stdout or 'Created' in obstack_up.stdout or 'Recreated' in obstack_up.stdout"

- name: Wait for Nginx TLS reverse proxy readiness
  ansible.builtin.uri:
    url: https://127.0.0.1/api/health
    validate_certs: false
    status_code: 200
  register: nginx_ready
  retries: 12
  delay: 5
  until: nginx_ready.status == 200

- name: Wait for Prometheus readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    status_code: 200
  register: prometheus_ready
  retries: 12
  delay: 5
  until: prometheus_ready.status == 200

- name: Wait for Grafana health
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
  register: grafana_ready
  retries: 12
  delay: 5
  until: grafana_ready.status == 200

- name: Wait for Loki readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:3100/ready
    status_code: 200
  register: loki_ready
  retries: 12
  delay: 5
  until: loki_ready.status == 200

- name: Wait for Alertmanager readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
    status_code: 200
  register: alertmanager_ready
  retries: 12
  delay: 5
  until: alertmanager_ready.status == 200

- name: Wait for Blackbox Exporter health
  ansible.builtin.uri:
    url: http://127.0.0.1:9115/-/healthy
    status_code: 200
  register: blackbox_ready
  retries: 12
  delay: 5
  until: blackbox_ready.status == 200
