---
- name: Require Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "24.04"
- name: Install WireGuard
  ansible.builtin.apt:
    name: [wireguard, wireguard-tools]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Secure WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Render private interface config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ obstack_wg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard
- name: Enable WireGuard interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ obstack_wg_interface }}"
    enabled: true
    state: started
- name: Read WireGuard status
  ansible.builtin.command: "wg show {{ obstack_wg_interface }}"
  register: wg_status
  changed_when: false
- name: Report status without secrets
  ansible.builtin.debug:
    msg: "{{ wg_status.stdout_lines | reject('search', 'private key') | list }}"
